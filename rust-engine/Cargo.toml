
[package]
name = "nour-sentinel"
version = "0.3.0"
edition = "2021"
description = "Intelligent Network Security Engine"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
